# Location for Open-Meteo forecast (no API key needed)
location:
  lat: 49.2716
  lon: -123.1839

# ET₀ soil water balance parameters
# Tune these to match your lawn and sprinkler system.
water_balance:
  # Maximum water the soil can hold (mm). Typical lawn: 25–40 mm.
  field_capacity_mm: 30
  # Skip watering if estimated soil moisture is above this (mm).
  # Lower = more conservative (waters more often).
  watering_threshold_mm: 10
  # Water added per sprinkler session (mm). Typical residential: 10–15 mm.
  watering_depth_mm: 12
  # Days of historical data to reconstruct current soil moisture.
  lookback_days: 14
  # Days of forecast to project upcoming watering decisions.
  forecast_days: 7

# Watering schedule — days the sprinkler runs (lowercase, full name)
watering_days:
  - tuesday
  - thursday
  - sunday

# Hour the sprinkler runs (24h, local time)
watering_hour: 3

# Discord bot
discord:
  guild_id: 1197616467336777759
  channel_id: 1520154665738834093

# sprinklers_pi web interface
sprinkler_pi:
  base_url: "http://192.168.1.120:8080"

# Logging
log_file: "/var/log/sprinkler-rain-delay.log"
