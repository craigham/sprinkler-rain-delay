# Weather Underground API key (override via WU_API_KEY env var or Docker secret)
wu_api_key: ""

# PWS station ID
station_id: "IVANCO101"

# Sprinklers Pi API base URL
sprinklers_api_url: "http://192.168.1.120:8080"

# Rain delay thresholds
rain_probability_threshold: 60    # percent
rain_accumulation_threshold: 0.25 # inches

# Watering days (0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun)
watering_days: [1, 3, 6]

# Watering time (used to pick the relevant forecast window)
watering_hour: 3
